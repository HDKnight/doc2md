<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>doc2md · 文档转 Markdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="top">
      <div class="brand">doc2md</div>
      <p class="tag">PDF / DOCX → Markdown · 本地低资源转换</p>
    </header>

    <section class="panel drop" id="dropzone" tabindex="0">
      <input type="file" id="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
      <div class="drop-inner">
        <p class="drop-title">拖拽文件到此处，或点击选择</p>
        <p class="drop-hint">支持 .pdf / .docx，最大 50MB</p>
        <p class="file-name" id="fileName">未选择文件</p>
      </div>
    </section>

    <section class="panel controls">
      <label class="field">
        <span>OCR</span>
        <select id="ocr">
          <option value="auto" selected>auto（默认）</option>
          <option value="on">on（强制）</option>
          <option value="off">off（仅文本层）</option>
        </select>
      </label>
      <label class="field">
        <span>OCR 模型</span>
        <select id="ocrModel">
          <option value="tiny" selected>tiny（最快，默认）</option>
          <option value="small">small（更准，较慢）</option>
        </select>
      </label>
      <label class="field">
        <span>识别管线</span>
        <select id="pipeline" title="三者独立：规则=OCR+textnorm；表征=structure JSON+bbox；Structure=oar 原生 MD">
          <option value="rules">规则（OCR+textnorm）</option>
          <option value="geom" selected>表征（JSON+bbox）</option>
          <option value="structure">Structure（oar 原生 MD）</option>
        </select>
      </label>
      <label class="field" id="featEngineField">
        <span>表征引擎</span>
        <select id="featEngine" title="仅表征管线生效；默认 oar">
          <option value="oar" selected>oar（默认）</option>
          <option value="indra">indra</option>
        </select>
      </label>
      <label class="field field-check">
        <span>方向分类</span>
        <input type="checkbox" id="ocrUseCls" />
      </label>
      <button type="button" class="btn primary" id="convertBtn" disabled>开始转换</button>
      <button type="button" class="btn ghost" id="downloadBtn" disabled>下载当前视图</button>
      <button type="button" class="btn ghost" id="clearBtn" disabled>清空</button>
    </section>

    <section class="panel status" id="status" hidden></section>

    <section class="panel result" id="resultPanel" hidden>
      <div class="result-bar">
        <div class="meta" id="meta"></div>
        <div class="view-toggle" role="tablist" aria-label="视图切换">
          <button type="button" class="tab active" id="tabPreview" role="tab" aria-selected="true">预览</button>
          <button type="button" class="tab" id="tabMarkdown" role="tab" aria-selected="false">源码</button>
          <button type="button" class="tab" id="tabText" role="tab" aria-selected="false">原文</button>
        </div>
      </div>
      <article class="md-preview" id="previewView" hidden></article>
      <pre class="md-source" id="sourceView" hidden></pre>
      <pre class="md-source" id="textView" hidden></pre>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
