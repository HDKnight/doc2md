[package]
name = "oar_structure_worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "doc2md warm structure sidecar (pp_structurev3); stdin JSON protocol"

[[bin]]
name = "oar_structure_worker"
path = "src/main.rs"

[dependencies]
oar-ocr = { version = "0.10.2", default-features = true, features = ["auto-download", "directml"] }
hayro = "0.8"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
