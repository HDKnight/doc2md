<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>doc2md · 文档转 Markdown</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="top">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div>
        <h1 class="brand">doc2md</h1>
        <p class="tag">本地把 PDF、DOCX、TXT 转成带标题的 Markdown</p>
      </div>
    </header>

    <section class="workspace">
      <section class="panel drop" id="dropzone" tabindex="0" role="button" aria-label="选择文件">
        <input type="file" id="file" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden />
        <div class="drop-inner">
          <div class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="42" height="42">
              <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M14 8h14l8 8v24H14z"/>
              <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M28 8v8h8"/>
              <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M20 28h8M24 24v8"/>
            </svg>
          </div>
          <p class="drop-title">拖拽文件到此处，或点击选择</p>
          <p class="drop-hint">PDF、DOCX、TXT · 最大 50MB · 文字版直接抽取，扫描件自动表征</p>
          <p class="file-name" id="fileName">未选择文件</p>
        </div>
      </section>

      <section class="panel actions">
        <div class="action-row">
          <button type="button" class="btn primary" id="convertBtn" disabled>开始转换</button>
          <button type="button" class="btn ghost" id="copyBtn" disabled>复制 Markdown</button>
          <button type="button" class="btn ghost" id="downloadBtn" disabled>下载</button>
          <button type="button" class="btn ghost" id="clearBtn" disabled>清空</button>
        </div>
      </section>
    </section>

    <section class="panel status" id="status" hidden></section>

    <section class="panel result" id="resultPanel" hidden>
      <div class="stat-row" id="statRow">
        <div class="stat">
          <span>页数</span>
          <b id="statPages">—</b>
        </div>
        <div class="stat">
          <span>OCR 识别页数</span>
          <b id="statOCR">—</b>
        </div>
        <div class="stat">
          <span>识别速率</span>
          <b id="statRate">—</b>
        </div>
      </div>
      <div class="result-bar">
        <div class="meta" id="meta"></div>
        <div class="view-toggle" role="tablist" aria-label="视图切换">
          <button type="button" class="tab active" id="tabPreview" role="tab" aria-selected="true">预览</button>
          <button type="button" class="tab" id="tabMarkdown" role="tab" aria-selected="false">源码</button>
          <button type="button" class="tab" id="tabText" role="tab" aria-selected="false">原文</button>
        </div>
      </div>
      <article class="md-preview" id="previewView"></article>
      <pre class="md-source" id="sourceView" hidden></pre>
      <pre class="md-source" id="textView" hidden></pre>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
